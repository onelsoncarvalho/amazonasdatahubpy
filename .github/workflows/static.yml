# Build and deploy bilingual docs  to GitHub Pages
name: Deploy docs to Pages

on:
  # Runs on pushes targeting the default branch
  push:
    branches: ["main"]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# contents: write é necessário para o bot commitar os arquivos .po
permissions:
  contents: write
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install Poetry
        uses: snok/install-poetry@v1
        with:
          virtualenvs-create: true
          virtualenvs-in-project: true
      - name: Install Dependencies
        run: poetry install --with dev

      - name: Extract and update translation catalogs
        run: |
          source .venv/bin/activate
          sphinx-build -b gettext docs docs/_build/gettext
          sphinx-intl update -p docs/_build/gettext -d docs/locales -l pt_BR

      - name: Translate new strings (DeepL)
        env:
          DEEPL_API_KEY: ${{ secrets.DEEPL_API_KEY }}
        run: |
          source .venv/bin/activate
          python scripts/translate_po.py

      - name: Commit updated .po files
        run: |
          git config user.name "docs-bot"
          git config user.email "docs-bot@users.noreply.github.com"
          git add docs/locales
          if ! git diff --staged --quiet; then
            git commit -m "chore(i18n): update translations"
            git pull --rebase origin main
            git push origin HEAD:main
          fi

      - name: Build Documentation (EN + PT-BR)
        run: |
          source .venv/bin/activate
          sphinx-build -b html -D language=en    docs _site/en
          sphinx-build -b html -D language=pt_BR docs _site/br
          touch _site/.nojekyll
          echo '<meta http-equiv="refresh" content="0; url=en/">' > _site/index.html

      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '_site'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
