[tool.poetry]
name = "amazonasdatahub"
version = "0.2.3"
description = "The goal of amazonasdatahub is to gather various data sets from the state of Amazonas (AM), Brazil, to which Deep Learning can be applied."
authors = ["Nelson Geraldo Aquino de Carvalho"]
license = "MIT"
readme = "README.md"
include = ["amazonasdatahub/docs/*.md"]


[tool.poetry.dependencies]
python = "^3.12"
pandas = "^3.0.2"
python-frontmatter = "^1.1.0"
requests = "^2.33.1"
pyarrow = "^24.0.0"
shibuya = "^2026.7.12"

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "myst-nb (>=1.4.0,<2.0.0)",
    "sphinx-autoapi (>=3.8.1,<4.0.0)",
    "shibuya (>=2026.7.12,<2027.0.0)"
]
